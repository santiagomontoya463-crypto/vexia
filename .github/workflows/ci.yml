name: Revisión automática

# En cada cambio que subas a GitHub, comprueba que la aplicación compila.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Revisar el código (informativo)
        run: npm run lint
        continue-on-error: true

      - name: Compilar
        run: npm run build
